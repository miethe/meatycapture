name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before building'
        required: false
        default: 'false'
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: darwin-arm64
            artifact: meatycapture-darwin-arm64
            can_test: true

          # macOS x64 (Intel)
          - os: macos-13
            target: darwin-x64
            artifact: meatycapture-darwin-x64
            can_test: true

          # Linux x64
          - os: ubuntu-latest
            target: linux-x64
            artifact: meatycapture-linux-x64
            can_test: true

          # Linux ARM64 (cross-compiled from x64)
          - os: ubuntu-latest
            target: linux-arm64
            artifact: meatycapture-linux-arm64
            can_test: false

          # Windows x64
          - os: windows-latest
            target: windows-x64
            artifact: meatycapture-windows-x64.exe
            can_test: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '8.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: ${{ !inputs.skip_tests && matrix.can_test }}
        run: pnpm test run

      - name: Build binary for ${{ matrix.target }}
        run: bun run build-binary.ts --target ${{ matrix.target }}

      - name: Verify binary exists
        shell: bash
        run: |
          BINARY_PATH="dist/bin/${{ matrix.artifact }}"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: Binary not found at $BINARY_PATH"
            ls -la dist/bin/ || echo "dist/bin/ directory not found"
            exit 1
          fi
          echo "Binary created successfully: $BINARY_PATH"
          ls -lh "$BINARY_PATH"

      - name: Check binary size
        shell: bash
        run: |
          BINARY_PATH="dist/bin/${{ matrix.artifact }}"
          SIZE_BYTES=$(stat -f%z "$BINARY_PATH" 2>/dev/null || stat -c%s "$BINARY_PATH" 2>/dev/null)
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 150 ]; then
            echo "WARNING: Binary size exceeds 150MB threshold"
          fi

      - name: Test binary execution (native builds only)
        if: ${{ matrix.can_test }}
        shell: bash
        run: |
          BINARY_PATH="dist/bin/${{ matrix.artifact }}"
          chmod +x "$BINARY_PATH" 2>/dev/null || true
          echo "Testing --version output:"
          "$BINARY_PATH" --version
          echo ""
          echo "Testing --help output:"
          "$BINARY_PATH" --help | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/bin/${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "=== Build Summary ==="
          echo ""
          echo "All binary builds completed."
          echo ""
          echo "Artifacts available:"
          echo "  - meatycapture-darwin-arm64 (macOS Apple Silicon)"
          echo "  - meatycapture-darwin-x64 (macOS Intel)"
          echo "  - meatycapture-linux-x64 (Linux x64)"
          echo "  - meatycapture-linux-arm64 (Linux ARM64)"
          echo "  - meatycapture-windows-x64.exe (Windows x64)"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: List all binaries
        run: |
          echo "=== Downloaded Binaries ==="
          find binaries -type f -exec ls -lh {} \;
